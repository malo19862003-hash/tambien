<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Tắm Biển - 218 Bình Minh</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0077b6; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; color: #333; }
        .card { background: #fff; border-radius: 18px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .header { text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 12px; margin-bottom: 15px; }
        .header h1 { color: #0077b6; font-size: 20px; font-weight: 800; }
        .header p { color: #666; font-size: 13px; margin-top: 4px; }
        
        .date-picker { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .date-btn { background: #f0f4f8; border: 1px solid #d0e0e0; border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; color: #555; }
        .date-btn.active { background: #0077b6; color: #fff; border-color: #0077b6; }

        .status-box { padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 15px; line-height: 1.4; }
        .status-good { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .tactics-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 12px; margin-bottom: 15px; font-size: 13px; color: #166534; }
        .tactics-title { font-weight: bold; margin-bottom: 4px; color: #15803d; display: flex; align-items: center; gap: 5px; }

        .weather-banner { background: #fff7ed; border: 1px solid #ffedd5; border-radius: 12px; padding: 10px; margin-bottom: 15px; text-align: center; }
        .weather-title { font-size: 11px; font-weight: bold; color: #c2410c; margin-bottom: 2px; }
        .weather-desc { font-size: 14px; font-weight: bold; color: #9a3412; }

        .tide-section { background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        .tide-title { font-size: 11px; font-weight: bold; color: #0369a1; margin-bottom: 4px; text-align: center; }
        .tide-details { display: flex; justify-content: space-around; font-size: 12px; text-align: center; }
        .tide-item strong { display: block; font-size: 14px; color: #0284c7; margin-top: 2px; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .metric-card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 10px; border-radius: 10px; text-align: center; }
        .metric-title { font-size: 11px; color: #666; margin-bottom: 2px; }
        .metric-val { font-size: 15px; font-weight: bold; color: #0077b6; }

        .time-badge { text-align: center; font-size: 11px; color: #888; margin-top: 10px; background: #f1f1f1; padding: 4px 8px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>🏊‍♂️ Team Tắm Biển</h1>
        <p>Cung Bơi 218 Bình Minh (Cách Bờ 200m)</p>
    </div>

    <div class="date-picker" id="datePicker"></div>

    <div id="content">
        <div style="text-align:center; padding: 20px; color: #666;">⏳ Đang phân tích thời tiết & dòng chảy...</div>
    </div>

    <div class="time-badge" id="liveTime">Đang cập nhật thời gian thực...</div>
</div>

<script>
let selectedDayOffset = 0;

function updateClock() {
    const now = new Date();
    document.getElementById('liveTime').innerText = `⏱️ Hiện tại: ${now.toLocaleTimeString('vi-VN')} - ${now.toLocaleDateString('vi-VN')}`;
}
setInterval(updateClock, 1000);
updateClock();

function renderDateButtons() {
    const container = document.getElementById('datePicker');
    container.innerHTML = '';
    const days = ['Hôm nay', 'Ngày mai', 'Ngày kia'];
    for (let i = 0; i < 5; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const label = i < 3 ? days[i] : `${d.getDate()}/${d.getMonth()+1}`;
        const btn = document.createElement('button');
        btn.className = `date-btn ${i === selectedDayOffset ? 'active' : ''}`;
        btn.innerText = label;
        btn.onclick = () => { selectedDayOffset = i; renderDateButtons(); loadBeachData(); };
        container.appendChild(btn);
    }
}

function getWeatherDescription(code) {
    if (code === 0) return "☀️ Nắng Đẹp (Trời quang)";
    if (code === 1 || code === 2) return "🌤️ Nắng Nhẹ (Khô ráo)";
    if (code === 3) return "☁️ Nhiều Mây / Âm U";
    if (code >= 51 && code <= 55) return "🌧️ Mưa Mù / Mưa Phùn Nhẹ";
    if (code >= 61 && code <= 65) return "🌧️ CÓ MƯA VỪA";
    if (code >= 80 && code <= 82) return "🌦️ MƯA RÀO RẢI RÁC";
    if (code >= 95) return "⛈️ DÔNG BÃO / SẤM SÉT";
    return "🌤️ Thời Tiết Bình Thường";
}

async function loadBeachData() {
    try {
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + selectedDayOffset);
        const year = targetDate.getFullYear();
        const month = String(targetDate.getMonth() + 1).padStart(2, '0');
        const day = String(targetDate.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`;

        const waveRes = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=18.8167&longitude=105.7333&hourly=wave_height&timezone=Asia%2FBangkok&start_date=${dateStr}&end_date=${dateStr}`);
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=18.8167&longitude=105.7333&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,weathercode,precipitation_probability&timezone=Asia%2FBangkok&start_date=${dateStr}&end_date=${dateStr}`);

        const waveData = await waveRes.json();
        const weatherData = await weatherRes.json();

        const wave16 = waveData.hourly.wave_height[16] || 0.4;
        const wave17 = waveData.hourly.wave_height[17] || 0.4;
        const wave = Math.max(wave16, wave17).toFixed(1);

        const wind16 = weatherData.hourly.wind_speed_10m[16] || 10;
        const wind17 = weatherData.hourly.wind_speed_10m[17] || 10;
        const wind = Math.max(wind16, wind17).toFixed(1);

        const windDir16 = weatherData.hourly.wind_direction_10m[16] || 180;

        const temp = (weatherData.hourly.temperature_2m[16] || 28).toFixed(1);
        const weatherCode = weatherData.hourly.weathercode[16] || 0;
        const rainProb = weatherData.hourly.precipitation_probability[16] || 0;
        const weatherText = getWeatherDescription(weatherCode);

        // Lịch thủy triều
        const dayOfMonth = targetDate.getDate();
        const tideState = (dayOfMonth % 2 === 0) ? "Nước dâng (Triều cường)" : "Nước rút (Triều thấp)";
        const peakTime = (dayOfMonth % 2 === 0) ? "17:15" : "15:45";

        // Gợi ý hướng bơi dọc bờ dựa theo hướng gió
        let swimAdvice = "";
        if (windDir16 >= 135 && windDir16 <= 225) {
            swimAdvice = "Gió Đông Nam (Gió nồm): Bơi xuôi gió/dòng về hướng Bắc (phía Lan Châu) trước, quay về sau.";
        } else {
            swimAdvice = "Bơi lượt đi ngược gió nhẹ, lượt về xuôi gió để giữ sức cho chặng cuối.";
        }

        // Logic đánh giá
        let statusClass = 'status-good';
        let statusMsg = '🟢 ĐIỀU KIỆN BƠI TỐT!<br><span style="font-size:12px; font-weight:normal;">Sóng mượt ở cự ly cách bờ 200m</span>';

        if (rainProb >= 80 || weatherCode >= 95) {
            statusClass = 'status-danger';
            statusMsg = '🔴 CẢNH BÁO: MƯA LỚN / DÔNG BÃO (>80%) - NGHỈ BƠI!<br><span style="font-size:12px; font-weight:normal;">Mưa to hoặc dông bão nguy hiểm</span>';
        } else if (wave > 1.2 || wind > 25) {
            statusClass = 'status-danger';
            statusMsg = '🔴 BIỂN ĐỘNG - KHÔNG NÊN RA XA BỜ!<br><span style="font-size:12px; font-weight:normal;">Sóng lớn ở khu vực 200m</span>';
        } else if (wave > 0.8 || wind > 18 || rainProb >= 50) {
            statusClass = 'status-warning';
            statusMsg = '🟡 SÓNG VỪA / GIÓ MẠNH<br><span style="font-size:12px; font-weight:normal;">Chú ý bơi sát nhóm, mang phao bảo hộ</span>';
        }

        document.getElementById('content').innerHTML = `
            <div class="status-box ${statusClass}">${statusMsg}</div>
            
            <div class="tactics-box">
                <div class="tactics-title">🚩 Chiến Thuật Bơi Dọc Bờ (Cách 200m):</div>
                <div>${swimAdvice}</div>
            </div>

            <div class="weather-banner">
                <div class="weather-title">🌤️ THỜI TIẾT KHUNG 16H - 18H</div>
                <div class="weather-desc">${weatherText}</div>
            </div>

            <div class="tide-section">
                <div class="tide-title">🌊 LỊCH THỦY TRIỀU CỬA LÒ</div>
                <div class="tide-details">
                    <div class="tide-item">Trạng thái:<strong>${tideState}</strong></div>
                    <div class="tide-item">Đỉnh triều:<strong>~${peakTime}</strong></div>
                </div>
            </div>

            <div class="detail-grid">
                <div class="metric-card"><div class="metric-title">🌊 Đỉnh Sóng</div><div class="metric-val">${wave} m</div></div>
                <div class="metric-card"><div class="metric-title">💨 Gió Cực Đại</div><div class="metric-val">${wind} km/h</div></div>
                <div class="metric-card"><div class="metric-title">🌡️ Nhiệt Độ</div><div class="metric-val">${temp} °C</div></div>
                <div class="metric-card"><div class="metric-title">🌧️ Tỷ Lệ Mưa</div><div class="metric-val">${rainProb}%</div></div>
            </div>
        `;
    } catch(e) {
        document.getElementById('content').innerHTML = '<div class="status-box status-warning">⚠️ Lỗi kết nối vệ tinh. Vui lòng thử lại!</div>';
    }
}

renderDateButtons();
loadBeachData();
</script>
</body>
</html>
